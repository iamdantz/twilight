name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  SCRIPTS: .agents/skills/twilight-auditor/scripts

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ env.SCRIPTS }}/requirements.txt

      - run: pip install -r "$SCRIPTS/requirements.txt"

      - name: Validate against the base
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD^1"
          fi
          python "$SCRIPTS/validate.py" --compare "$base" | tee report.txt
        env:
          PYTHONUNBUFFERED: "1"

      - name: Report
        if: always()
        run: |
          [ -f report.txt ] || exit 0
          { echo '```'; sed '/^## JSON summary/,$d' report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # A pull request that edits the validator is checked by its own copy. Run the base copy too, so a loosened
      # check shows up. It does not block: a legitimate method change fails the base copy's reproduction.
      - name: Base validator on this change (informative)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --quiet "$base"...HEAD -- "$SCRIPTS"; then
            echo "The validator is unchanged."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/base"
          git archive "$base" "$SCRIPTS" | tar -x -C "$RUNNER_TEMP/base"
          set -o pipefail
          python "$RUNNER_TEMP/base/$SCRIPTS/validate.py" --no-rebuild --compare "$base" | tee base-report.txt
        env:
          PYTHONUNBUFFERED: "1"

  robust:
    name: robust
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Does the change touch the construction?
        id: changes
        run: |
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          # Every release bumps the palette's version, so the palette counts as changed only beyond that field.
          same_palette=$(python3 -c '
          import json, subprocess, sys
          load = lambda ref: {k: v for k, v in json.loads(subprocess.run(["git", "show", ref + ":palette/twilight.json"],
                              capture_output=True, text=True, check=True).stdout).items() if k != "version"}
          print("true" if load(sys.argv[1]) == load("HEAD") else "false")' "$base")
          if [ "$same_palette" = true ] && git diff --quiet "$base" HEAD -- \
               "$SCRIPTS/construct.py" "$SCRIPTS/validate.py" "$SCRIPTS/requirements.txt"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Construction unchanged: the optimizer is deterministic, so the robustness check is skipped."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ env.SCRIPTS }}/requirements.txt

      - if: steps.changes.outputs.run == 'true'
        run: pip install -r "$SCRIPTS/requirements.txt"

      - name: Rebuild with twice the optimizer restarts
        if: steps.changes.outputs.run == 'true'
        run: python "$SCRIPTS/validate.py" --robust
        env:
          PYTHONUNBUFFERED: "1"
